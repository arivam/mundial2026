# 1. Estructura básica: Nombre
name: Hello World GitHub Actions

# 2. Triggers (Disparadores): push, pull_request y manual (workflow_dispatch)
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # Job 1: Demostración de comandos, variables de contexto y outputs
  saludo:
    # 3. Runner: Entorno ubuntu-latest
    runs-on: ubuntu-latest

    # 4. Outputs: Exportar un dato generado para otros jobs
    #outputs:
      #mensaje_salida: ${{ steps.crear_output.outputs.saludo_custom }}

    steps:
      - name: Comandos simples y Variables de Contexto de GitHub
        run: |
          echo "¡Hola mundo desde GitHub Actions!"
          echo "Fecha actual: $(date)"
          echo "Ejecutado por el usuario: $GITHUB_ACTOR"
          echo "Sistema Operativo: $RUNNER_OS"

      - name: Script multilínea
        run: |
          echo "--- Inicio script multilínea ---"
          echo "Evento disparador: $GITHUB_EVENT_NAME"
          echo "--- Fin script multilínea ---"

      - name: Generar datos usando $GITHUB_OUTPUT
        id: crear_output
        run: echo "saludo_custom=Hola desde el Job Saludo" >> $GITHUB_OUTPUT


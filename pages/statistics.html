<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resumen y Estadísticas – Polla Mundial 2026</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <script src="../vendor/chart.umd.js"></script>
  <script src="../vendor/jspdf.umd.min.js"></script>
  <script src="../vendor/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
  <header>
    <nav class="nav-bar">
      <a href="../index.html" class="nav-link">🏠 Inicio</a>
      <a href="group-stage.html" class="nav-link">⚽ Fase de Grupos</a>
      <a href="knockout-stage.html" class="nav-link">🏆 Eliminatorias</a>
      <a href="statistics.html" class="nav-link active">📊 Estadísticas</a>
      <a href="users.html" class="nav-link">👥 Usuarios</a>
      <a href="users.html" class="nav-link">🎫 Apuestas</a>
    </nav>
    <div class="header-title">
      <h1>📊 Estadísticas</h1>
    </div>
    <button class="toggle-theme" id="themeBtn" title="Cambiar tema">🌙</button>
  </header>
  <main class="stats-container">
    <section id="summarySection" class="chart-section"></section>
    <section id="goalsByGroupSection" class="chart-section"></section>
    <section id="topScorerSection" class="chart-section"></section>

    <section class="chart-section">
      <h2>Ranking de Usuarios</h2>
      <canvas id="rankingChart" width="400" height="200"></canvas>
      <button id="exportCsv">Exportar CSV</button>
      <button id="exportPdf">Exportar PDF</button>
      <div class="ranking-table-wrapper">
      <table id="rankingTable" class="ranking-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Usuario (Apuesta)</th>
            <th title="Ronda de 32">R32</th>
            <th title="Octavos">R16</th>
            <th title="Cuartos">QF</th>
            <th title="Semifinales">SF</th>
            <th title="Final">F</th>
            <th title="4to Puesto">4º</th>
            <th title="3er Puesto">3º</th>
            <th title="Subcampeón">Sub</th>
            <th title="Campeón">Camp</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      </div>
    </section>
  </main>
  <footer class="app-footer">
    <p>Mundial de Fútbol 2026 &mdash; Canada · México · USA</p>
  </footer>

  <script src="../js/config.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/statisticsInit.js"></script>
</body>
</html>
